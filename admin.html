<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة تحكم — AZURE.EGY</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,460;9..144,600&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===================================================================
   AZURE.EGY — design tokens
   bg        #05060a   near-black, faint blue undertone
   surface   #0d0f16   panel / button base
   line      #21242f   hairline borders
   gold-1    #f4dd9b   gold highlight
   gold-2    #c9a227   gold core
   gold-3    #8a6a12   gold shadow
   azure     #2e6fff   whisper accent, name-reference, used sparingly
   ink       #f5f2ea   warm ivory text
   ink-dim   #9a9689   muted text
   =================================================================== */

:root {
  --bg: #05060a;
  --surface: #0d0f16;
  --line: #21242f;
  --gold-1: #f4dd9b;
  --gold-2: #c9a227;
  --gold-3: #8a6a12;
  --azure: #2e6fff;
  --ink: #f5f2ea;
  --ink-dim: #9a9689;
  --gold-grad: linear-gradient(115deg, var(--gold-3), var(--gold-1) 45%, var(--gold-2) 70%, var(--gold-3));
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  min-height: 100%;
}

body {
  font-family: "Cairo", "Segoe UI", sans-serif;
  position: relative;
  overflow-x: hidden;
  display: flex;
  justify-content: center;
}

/* ambient aura behind everything */
.aura {
  position: fixed;
  inset: -20%;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(38% 32% at 50% 8%, rgba(46, 111, 255, 0.16), transparent 60%),
    radial-gradient(45% 40% at 80% 85%, rgba(201, 162, 39, 0.10), transparent 60%),
    radial-gradient(40% 35% at 15% 80%, rgba(201, 162, 39, 0.07), transparent 60%);
  animation: auraDrift 22s ease-in-out infinite alternate;
}

@keyframes auraDrift {
  0%   { transform: translate3d(0, 0, 0) rotate(0deg); }
  100% { transform: translate3d(0, -2%, 0) rotate(4deg); }
}

.page {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 460px;
  padding: 56px 24px 40px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* ---- brand logo ---- */
.brand-logo {
  width: min(260px, 70vw);
  height: auto;
  opacity: 0;
  filter: drop-shadow(0 0 26px rgba(201, 162, 39, 0.14));
  transform: translateY(14px) scale(0.97);
  animation: logoIn 1.1s cubic-bezier(.19,1,.22,1) 0.2s forwards;
}

@keyframes logoIn {
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.divider {
  width: 40px;
  height: 1px;
  margin: 28px 0 30px;
  background: var(--gold-grad);
  opacity: 0;
  animation: fadeIn 0.8s ease 0.95s forwards;
}

@keyframes riseIn {
  to { opacity: 1; transform: translateY(0); }
}
@keyframes fadeIn {
  to { opacity: 1; }
}

/* ---- links ---- */
.links {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.link-btn {
  position: relative;
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  padding: 17px 20px;
  border-radius: 14px;
  background: var(--surface);
  border: 1px solid var(--line);
  color: var(--ink);
  text-decoration: none;
  font-size: 15.5px;
  font-weight: 600;
  letter-spacing: 0.01em;
  overflow: hidden;
  isolation: isolate;
  opacity: 0;
  transform: translateY(16px);
  animation: riseIn 0.65s cubic-bezier(.19,1,.22,1) forwards;
  transition: border-color 0.4s ease, transform 0.35s cubic-bezier(.19,1,.22,1), box-shadow 0.4s ease;
  will-change: transform;
}

.link-btn:nth-child(1) { animation-delay: 1.05s; }
.link-btn:nth-child(2) { animation-delay: 1.17s; }
.link-btn:nth-child(3) { animation-delay: 1.29s; }
.link-btn:nth-child(4) { animation-delay: 1.41s; }
.link-btn:nth-child(5) { animation-delay: 1.53s; }
.link-btn:nth-child(6) { animation-delay: 1.65s; }
.link-btn:nth-child(n+7) { animation-delay: 1.75s; }

.link-btn .icon {
  width: 22px;
  height: 22px;
  flex-shrink: 0;
  color: var(--gold-1);
}

.link-btn .arrow {
  margin-inline-start: auto;
  width: 16px;
  height: 16px;
  opacity: 0.55;
  transition: transform 0.35s cubic-bezier(.19,1,.22,1);
}

/* brushed-metal shine sweep */
.link-btn::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  background: linear-gradient(100deg, transparent 20%, rgba(244, 221, 155, 0.16) 45%, rgba(244, 221, 155, 0.35) 50%, rgba(244, 221, 155, 0.16) 55%, transparent 80%);
  transform: translateX(-130%);
  transition: transform 0.85s cubic-bezier(.19,1,.22,1);
}

.link-btn:hover,
.link-btn:focus-visible {
  border-color: rgba(201, 162, 39, 0.55);
  box-shadow: 0 8px 30px -12px rgba(201, 162, 39, 0.35), 0 0 0 1px rgba(201, 162, 39, 0.08) inset;
  transform: translateY(-2px);
  outline: none;
}

.link-btn:hover::before,
.link-btn:focus-visible::before {
  transform: translateX(130%);
}

.link-btn:hover .arrow { transform: translateX(-4px); }
[dir="rtl"] .link-btn:hover .arrow { transform: translateX(4px); }

.link-btn:active { transform: translateY(0) scale(0.98); }

footer {
  margin-top: 40px;
  font-size: 11.5px;
  letter-spacing: 0.08em;
  color: #55524a;
  opacity: 0;
  animation: fadeIn 1s ease 2.05s forwards;
}

footer a { color: #7a7669; text-decoration: none; }

@media (prefers-reduced-motion: reduce) {
  .aura { animation: none; }
  .brand-logo, .divider, .link-btn, footer {
    animation: none !important;
    opacity: 1 !important;
    transform: none !important;
  }
  .link-btn::before { display: none; }
}

</style>
<style>
  .page { max-width: 620px; padding-top: 40px; }
  .admin-head { text-align: center; margin-bottom: 30px; }
  .admin-head h1 {
    font-family: "Fraunces", serif; font-weight: 500; font-size: 26px;
    letter-spacing: 0.04em; margin: 0 0 6px;
  }
  .admin-head p { color: var(--ink-dim); font-size: 13px; margin: 0; }

  .gate { width: 100%; max-width: 320px; margin: 60px auto 0; text-align: center; }
  .gate input {
    width: 100%; padding: 15px 16px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--surface); color: var(--ink); font-family: inherit; font-size: 15px;
    text-align: center; letter-spacing: 0.1em; margin-bottom: 14px;
  }
  .gate input:focus { outline: none; border-color: var(--gold-2); }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 14px 18px; border-radius: 12px; border: 1px solid transparent;
    font-family: inherit; font-weight: 700; font-size: 14.5px; cursor: pointer;
    background: var(--gold-grad); color: #0a0a0a; transition: transform .25s ease, filter .25s ease;
  }
  .btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
  .btn:active { transform: translateY(0) scale(.98); }
  .btn.ghost {
    background: transparent; color: var(--ink); border-color: var(--line); font-weight: 600;
  }
  .btn.danger { background: transparent; border-color: #4a2323; color: #e08585; }
  .btn.small { width: auto; padding: 8px 14px; font-size: 12.5px; }

  .msg { font-size: 13px; margin-top: 10px; min-height: 18px; }
  .msg.error { color: #e08585; }
  .msg.ok { color: #9edb9e; }

  .panel { display: none; width: 100%; }
  .panel.show { display: block; }

  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 18px; margin-bottom: 18px;
  }
  .card h2 { font-size: 14px; margin: 0 0 14px; color: var(--gold-1); letter-spacing: 0.05em; }

  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12.5px; color: var(--ink-dim); margin-bottom: 6px; }
  .field input, .field select {
    width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line);
    background: #0a0b10; color: var(--ink); font-family: inherit; font-size: 14px;
  }
  .field input:focus, .field select:focus { outline: none; border-color: var(--gold-2); }

  .link-row {
    display: flex; align-items: center; gap: 10px; padding: 12px 14px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 10px;
  }
  .link-row .info { flex: 1; min-width: 0; }
  .link-row .info strong { display: block; font-size: 14px; }
  .link-row .info span { display: block; font-size: 12px; color: var(--ink-dim); direction: ltr; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .link-row .actions { display: flex; gap: 6px; flex-shrink: 0; }
  .icon-btn {
    width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: #0a0b10;
    color: var(--ink-dim); display: flex; align-items: center; justify-content: center; cursor: pointer;
    font-size: 13px;
  }
  .icon-btn:hover { color: var(--ink); border-color: var(--gold-2); }

  .logout-row { text-align: center; margin-top: 24px; }
  .logout-row a { color: var(--ink-dim); font-size: 12.5px; text-decoration: none; }

  .empty { text-align: center; color: var(--ink-dim); font-size: 13px; padding: 20px 0; }
</style>
</head>
<body>

<div class="aura" aria-hidden="true"></div>

<main class="page">

  <div class="admin-head">
    <h1>لوحة تحكم AZURE.EGY</h1>
    <p>ضيف أو عدّل أو احذف اللينكات اللي بتظهر في الصفحة</p>
  </div>

  <!-- password gate -->
  <section class="gate" id="gate">
    <input type="password" id="pw" placeholder="كلمة السر" autocomplete="current-password">
    <button class="btn" id="loginBtn">دخول</button>
    <p class="msg error" id="gateMsg"></p>
  </section>

  <!-- dashboard -->
  <section class="panel" id="panel">

    <div class="card">
      <h2>إضافة لينك جديد</h2>
      <div class="field">
        <label for="newLabel">الاسم اللي هيظهر</label>
        <input id="newLabel" placeholder="مثال: تيك توك">
      </div>
      <div class="field">
        <label for="newUrl">اللينك</label>
        <input id="newUrl" placeholder="https://...">
      </div>
      <div class="field">
        <label for="newIcon">الأيقونة</label>
        <select id="newIcon">
          <option value="instagram">إنستجرام</option>
          <option value="whatsapp">واتساب</option>
          <option value="phone">تليفون</option>
          <option value="link" selected>لينك عادي</option>
        </select>
      </div>
      <button class="btn" id="addBtn">إضافة اللينك</button>
      <p class="msg" id="addMsg"></p>
    </div>

    <div class="card">
      <h2>اللينكات الحالية</h2>
      <div id="list"></div>
    </div>

    <div class="logout-row">
      <a href="#" id="logoutBtn">خروج</a>
    </div>

  </section>

</main>

<script>
  const gate = document.getElementById("gate");
  const panel = document.getElementById("panel");
  const gateMsg = document.getElementById("gateMsg");
  const pwInput = document.getElementById("pw");
  const listEl = document.getElementById("list");

  let password = sessionStorage.getItem("azure_admin_pw") || "";
  let links = [];

  const ICON_LABEL = { instagram: "إنستجرام", whatsapp: "واتساب", phone: "تليفون", link: "لينك" };

  function showPanel() {
    gate.style.display = "none";
    panel.classList.add("show");
    fetchLinks();
  }

  async function call(action, payload) {
    const res = await fetch("/api/links", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ password, action, payload }),
    });
    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error(data.error || "حصل خطأ");
    return data.links;
  }

  async function fetchLinks() {
    const res = await fetch("/api/links", { cache: "no-store" });
    const data = await res.json();
    links = (data.links || []).sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
    renderList();
  }

  function renderList() {
    if (!links.length) {
      listEl.innerHTML = '<p class="empty">مفيش لينكات لسه</p>';
      return;
    }
    listEl.innerHTML = links.map((l, i) => `
      <div class="link-row" data-id="${l.id}">
        <div class="info">
          <strong>${escapeHtml(l.label)}</strong>
          <span>${escapeHtml(l.url)}</span>
        </div>
        <div class="actions">
          <button class="icon-btn" data-act="up" ${i === 0 ? "disabled" : ""} title="لفوق">&uarr;</button>
          <button class="icon-btn" data-act="down" ${i === links.length - 1 ? "disabled" : ""} title="لتحت">&darr;</button>
          <button class="icon-btn" data-act="edit" title="تعديل">✎</button>
          <button class="icon-btn" data-act="del" title="حذف">✕</button>
        </div>
      </div>
    `).join("");
  }

  listEl.addEventListener("click", async (e) => {
    const btn = e.target.closest(".icon-btn");
    if (!btn) return;
    const row = btn.closest(".link-row");
    const id = row.dataset.id;
    const act = btn.dataset.act;
    const idx = links.findIndex((l) => l.id === id);

    try {
      if (act === "del") {
        if (!confirm("متأكد إنك عايز تمسح اللينك ده؟")) return;
        links = await call("delete", { id });
        renderList();
      } else if (act === "up" && idx > 0) {
        [links[idx - 1], links[idx]] = [links[idx], links[idx - 1]];
        links = await call("reorder", { order: links.map((l) => l.id) });
        renderList();
      } else if (act === "down" && idx < links.length - 1) {
        [links[idx + 1], links[idx]] = [links[idx], links[idx + 1]];
        links = await call("reorder", { order: links.map((l) => l.id) });
        renderList();
      } else if (act === "edit") {
        const link = links[idx];
        const newLabel = prompt("الاسم:", link.label);
        if (newLabel === null) return;
        const newUrl = prompt("اللينك:", link.url);
        if (newUrl === null) return;
        links = await call("update", { id, label: newLabel, url: newUrl, icon: link.icon });
        renderList();
      }
    } catch (err) {
      alert(err.message);
    }
  });

  document.getElementById("addBtn").addEventListener("click", async () => {
    const label = document.getElementById("newLabel").value.trim();
    const url = document.getElementById("newUrl").value.trim();
    const icon = document.getElementById("newIcon").value;
    const msg = document.getElementById("addMsg");
    msg.className = "msg";
    msg.textContent = "";

    if (!label || !url) {
      msg.className = "msg error";
      msg.textContent = "لازم تكتب الاسم واللينك";
      return;
    }

    try {
      links = await call("add", { label, url, icon });
      document.getElementById("newLabel").value = "";
      document.getElementById("newUrl").value = "";
      msg.className = "msg ok";
      msg.textContent = "تم إضافة اللينك ✓";
      renderList();
    } catch (err) {
      msg.className = "msg error";
      msg.textContent = err.message;
    }
  });

  document.getElementById("loginBtn").addEventListener("click", tryLogin);
  pwInput.addEventListener("keydown", (e) => { if (e.key === "Enter") tryLogin(); });

  async function tryLogin() {
    const val = pwInput.value.trim();
    if (!val) return;
    gateMsg.textContent = "";
    password = val;
    try {
      // validate by attempting a harmless reorder-with-current-order call after fetch
      const res = await fetch("/api/links", { cache: "no-store" });
      const data = await res.json();
      const order = (data.links || []).map((l) => l.id);
      await call("reorder", { order });
      sessionStorage.setItem("azure_admin_pw", password);
      showPanel();
    } catch (err) {
      gateMsg.textContent = "كلمة السر غلط";
    }
  }

  document.getElementById("logoutBtn").addEventListener("click", (e) => {
    e.preventDefault();
    sessionStorage.removeItem("azure_admin_pw");
    location.reload();
  });

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
  }

  if (password) {
    pwInput.value = password;
    tryLogin();
  }
</script>

</body>
</html>
